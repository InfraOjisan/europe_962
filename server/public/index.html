<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会議は踊る、されど進まず — ローカルPoC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-text">
      <div class="brand-title">会議は踊る、されど進まず</div>
      <div class="brand-year"><span id="year">-</span>年 <span class="turn-sub">（第<span id="turn">-</span>ターン・<span id="phase">-</span>）</span></div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="war-gauge">
    <div class="war-gauge-label"><span>大戦への近さ</span><span id="war-pct">0%</span></div>
    <div class="war-gauge-track"><div class="war-gauge-fill" id="war-fill"></div></div>
  </div>
  <label class="ai-toggle">
    <input type="checkbox" id="use-ai">
    生成AIを使う（未設定時は自動フォールバック）
  </label>
  <button class="btn btn-outline" id="reset-btn">初期状態にリセット</button>
  <button class="btn btn-primary" id="advance-btn">次の年へ ▶</button>
</div>

<div id="gameover-banner" class="gameover-banner hidden"></div>

<div class="body-row">
  <div class="panel regions-panel">
    <div class="panel-title">州（Region）</div>
    <div id="regions" class="region-grid"></div>
  </div>

  <div class="panel factions-panel">
    <div class="panel-title">勢力（Faction）</div>
    <div id="factions" class="faction-list"></div>

    <div class="panel-title" style="margin-top: 16px;">軍団（Army）</div>
    <div id="armies" class="army-list"></div>
  </div>

  <div class="panel log-panel">
    <div class="panel-title">年表ログ</div>
    <div id="log" class="log-list"></div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
